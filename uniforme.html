<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monte seu uniforme</title>
    <script src="uniforme.js" defer></script>
    <link rel="stylesheet" href="style.css">

<body>

    <!--

    DESENHOS (SVG): feitos com ajuda de IA (Claude) a partir de fotos de referencia.
      Cada peca tem 3 modelos: camisa-1/2/3, bermuda-1/2/3 e meiao-1/2/3.
      So um modelo de cada peca fica visivel; o JavaScript (uniforme.js) liga e desliga.
    LOGICA: uniforme.js (escolha dos modelos, frente/costas e validacao de nome e numero).

    -->

    <header>
        <h1 id="titulo-pag">Ajude o Corinthians a montar o melhor uniforme da sua história!</h1>
    </header>

    <main class="montagem">

        <!-- COLUNA 1: PREVIEW -->
        <section class="preview">
            <h2 id="saudacao">Fala, Fiel!</h2>

            <!-- UNIFORME EM SVG (feito com ajuda de IA). Cada peca tem 3 modelos; o JS mostra so o escolhido. -->
            <svg id="uniforme" viewBox="0 0 200 400" stroke-linejoin="round" role="img" aria-label="Uniforme montado">
<defs>
<path id="sw" d="M0 7 C1.5 12 6 14.2 10 13 C17 11 25 6 32 0 C24 4.5 16 8 9.5 8.2 C5 8.3 1.5 7.2 0 7Z"/>

</defs>

</g>
</g>

<!-- ########## CAMADA 2: BERMUDAS ########## -->

<!-- BERMUDA 1: branca -->
<g id="bermuda-1" display="none"><path d="M61 196 L139 196 L148 262 L106 262 L100 230 L94 262 L52 262Z" fill="#f6f6f4" stroke="#9a9a9a"/><use href="#sw" transform="translate(66 203) scale(0.5)" fill="#151515"/><use href="#esc" transform="translate(129.5 205.5) scale(0.6818181818181818)" color="#151515"/><image href="imagens/escudo.png" x="122" y="198" width="15" height="15" preserveAspectRatio="xMidYMid meet" onload="this.previousElementSibling.setAttribute('visibility','hidden')" onerror="this.remove()"/></g>

<path d="M61 197 L52.5 261 M139 197 L147.5 261 M61 197.5 L139 197.5" stroke="#ff8a3d" stroke-width="2" fill="none"/>

<!-- MEIAO 1: branco, topo preto -->
<g id="meiao-1" display="none"><rect x="64" y="270" width="24" height="104" rx="6" fill="#f6f6f4" stroke="#9a9a9a"/><path d="M64 276 Q64 270 70 270 L82 270 Q88 270 88 276 L88 293 L64 293Z" fill="#151515"/><use href="#sw" transform="translate(68 312) scale(0.5)" fill="#151515"/><text x="76" y="336" font-size="5.2" font-weight="700" fill="#151515" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" letter-spacing="0.4">SCCP</text><rect x="112" y="270" width="24" height="104" rx="6" fill="#f6f6f4" stroke="#9a9a9a"/><path d="M112 276 Q112 270 118 270 L130 270 Q136 270 136 276 L136 293 L112 293Z" fill="#151515"/><use href="#sw" transform="translate(116 312) scale(0.5)" fill="#151515"/><text x="124" y="336" font-size="5.2" font-weight="700" fill="#151515" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" letter-spacing="0.4">SCCP</text></g>
<!-- MEIAO 2: preto, topo branco -->
<g id="meiao-2" display="none"><rect x="64" y="270" width="24" height="104" rx="6" fill="#151515" stroke="#555"/><path d="M64 276 Q64 270 70 270 L82 270 Q88 270 88 276 L88 293 L64 293Z" fill="#f6f6f4"/><use href="#sw" transform="translate(68 312) scale(0.5)" fill="#ffffff"/><text x="76" y="336" font-size="5.2" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" letter-spacing="0.4">SCCP</text><rect x="112" y="270" width="24" height="104" rx="6" fill="#151515" stroke="#555"/><path d="M112 276 Q112 270 118 270 L130 270 Q136 270 136 276 L136 293 L112 293Z" fill="#f6f6f4"/><use href="#sw" transform="translate(116 312) scale(0.5)" fill="#ffffff"/><text x="124" y="336" font-size="5.2" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" letter-spacing="0.4">SCCP</text></g>

<g id="meiao-3" display="none"><rect x="64" y="270" width="24" height="104" rx="6" fill="#151515" stroke="#555"/><path d="M64 276 Q64 270 70 270 L82 270 Q88 270 88 276 L88 293 L64 293Z" fill="#ff8a3d"/><use href="#sw" transform="translate(68 312) scale(0.5)" fill="#ff8a3d"/><text x="76" y="336" font-size="5.2" font-weight="700" fill="#ff8a3d" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" letter-spacing="0.4">SCCP</text><rect x="112" y="270" width="24" height="104" rx="6" fill="#151515" stroke="#555"/><path d="M112 276 Q112 270 118 270 L130 270 Q136 270 136 276 L136 293 L112 293Z" fill="#ff8a3d"/><use href="#sw" transform="translate(116 312) scale(0.5)" fill="#ff8a3d"/><text x="124" y="336" font-size="5.2" font-weight="700" fill="#ff8a3d" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" letter-spacing="0.4">SCCP</text></g>

<!-- CHUTEIRAS (fixas, aparecem sempre) -->
<ellipse cx="74" cy="384" rx="17" ry="7" fill="#111"/><ellipse cx="126" cy="384" rx="17" ry="7" fill="#111"/>

<!-- ########## COSTAS: nome e numero. O JS troca o texto e liga/desliga este grupo ########## -->
<g id="costas" display="none" font-family="Arial,sans-serif" font-weight="700" text-anchor="middle">
  <text id="txt-nome" x="100" y="62" font-size="12" fill="#151515">SEU NOME</text>
  <text id="txt-numero" x="100" y="112" font-size="46" fill="#151515">00</text>
</g>
</svg>

            <!-- Botao que alterna entre frente e costas (logica em uniforme.js) -->
            <button id="btn-lado" type="button" class="opcao">Ver costas</button>
        </section>

        <!-- COLUNA 2: OPCOES -->
        <section class="opcoes">
            <!-- Cada botao usa data-kit ou data-peca + data-modelo; o JS le esses atributos ao clicar -->
            <h2>Kits prontos</h2>
            <div class="grupo">
                <button type="button" class="opcao" data-kit="1">Kit 1 (branco)</button>
                <button type="button" class="opcao" data-kit="2">Kit 2 (preto)</button>
                <button type="button" class="opcao" data-kit="3">Kit 3 (laranja)</button>
            </div>

            <h2>Monte o seu</h2>

            <div class="grupo">
                <p>Camisa</p>
                <button type="button" class="opcao" data-peca="camisa" data-modelo="1" aria-pressed="false">1 · Branca</button>
                <button type="button" class="opcao" data-peca="camisa" data-modelo="2" aria-pressed="false">2 · Preta</button>
                <button type="button" class="opcao" data-peca="camisa" data-modelo="3" aria-pressed="false">3 · Laranja</button>
            </div>

            <div class="grupo">
                <p>Bermuda</p>
                <button type="button" class="opcao" data-peca="bermuda" data-modelo="1" aria-pressed="false">1 · Branca</button>
                <button type="button" class="opcao" data-peca="bermuda" data-modelo="2" aria-pressed="false">2 · Preta</button>
                <button type="button" class="opcao" data-peca="bermuda" data-modelo="3" aria-pressed="false">3 · Laranja</button>
            </div>

            <div class="grupo">
                <p>Meião</p>
                <button type="button" class="opcao" data-peca="meiao" data-modelo="1" aria-pressed="false">1 · Branco</button>
                <button type="button" class="opcao" data-peca="meiao" data-modelo="2" aria-pressed="false">2 · Preto</button>
                <button type="button" class="opcao" data-peca="meiao" data-modelo="3" aria-pressed="false">3 · Laranja</button>
            </div>

            <!-- Nome e numero das costas, com validacao em tempo real -->
            <div class="campos-jogador">
                <h2>Nome e número nas costas</h2>

                <label for="nome-camisa">Nome (2 a 12 letras)</label>
                <input type="text" id="nome-camisa" maxlength="12" autocomplete="off">
                <small class="erro" id="erro-nome-camisa"></small>

                <label for="numero-camisa">Número (0 a 99)</label>
                <input type="text" id="numero-camisa" maxlength="2" inputmode="numeric" autocomplete="off">
                <small class="erro" id="erro-numero-camisa"></small>
            </div>
        </section>

    </main>
